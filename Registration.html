<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADAR Emergency Response - Admin Login</title>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <style>
        :root {
            --primary-color: #007BFF; /* Blue */
            --secondary-color: #0056b3; /* Darker Blue */
            --black: #000000;
            --white: #ffffff;
            --gray: #efefef;
            --gray-2: #757575;
            --light-gray: #f4f4f4;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap');

        * {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100vh;
            overflow: hidden;
            background-color: var(--light-gray);
        }

        .container {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            height: 100%;
            width: 100%;
        }

        .col {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background-color: var(--white);
            border-radius: 1.5rem;
            box-shadow: rgba(0, 0, 0, 0.2) 0px 5px 15px;
            transition: transform 0.5s ease-in-out;
        }

        .form {
            width: 100%;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin: 1rem 0;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            font-size: 1.4rem;
            color: var(--gray-2);
        }

        .input-group input {
            width: 100%;
            padding: 1rem 3rem;
            font-size: 1rem;
            background-color: var(--gray);
            border-radius: .5rem;
            border: 1px solid var(--gray-2);
            outline: none;
            transition: border 0.3s;
        }

        .input-group input:focus {
            border: 1px solid var(--primary-color);
        }

        .form button {
            cursor: pointer;
            width: 100%;
            padding: .6rem 0;
            border-radius: .5rem;
            border: none;
            background-color: var(--primary-color);
            color: var(--white);
            font-size: 1.2rem;
            outline: none;
            transition: background-color 0.3s;
        }

        .form button:hover {
            background-color: var(--secondary-color);
        }

        .form p {
            margin: 1rem 0;
            font-size: .8rem;
        }

        .form h2 {
            margin-bottom: 1rem;
            font-size: 1.8rem;
            text-align: center;
            color: var(--primary-color);
        }

        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }

        .forgot-password b {
            color: var(--primary-color);
            cursor: pointer;
        }

        /* BACKGROUND */
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            height: 100vh;
            width: 300vw;
            transform: translate(35%, 0);
            background-image: linear-gradient(-45deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            transition: 1s ease-in-out;
            z-index: 6;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            border-bottom-right-radius: max(50vw, 50vh);
            border-top-left-radius: max(50vw, 50vh);
        }

        .container.sign-in::before {
            transform: translate(0, 0);
            right: 50%;
        }

        .container.sign-up::before {
            transform: translate(100%, 0);
            right: 50%;
        }

        /* MODAL FOR FORGOT PASSWORD */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--white);
            margin: 15% auto;
            padding: 20px;
            border: 1px solid var(--gray-2);
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .modal-content input {
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            border: 1px solid var(--gray-2);
            border-radius: 5px;
        }

        .modal-content button {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .modal-content button:hover {
            background-color: var(--secondary-color);
        }

        /* RESPONSIVE */
        @media only screen and (max-width: 425px) {
            .col {
                width: 100%;
                position: absolute;
                padding: 2rem;
                background-color: var(--white);
                border-top-left-radius: 2rem;
                border-top-right-radius: 2rem;
                transform: translateY(100%);
                transition: 1s ease-in-out;
            }

            .row {
                align-items: flex-end;
                justify-content: flex-end;
            }

            .form {
                box-shadow: none;
                margin: 0;
                padding: 0;
            }

            .text {
                margin: 0;
            }

            .text h2 {
                margin: .5rem;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="container" class="container" role="main">
        <!-- FORM SECTION -->
        <div class="row">
            <!-- SIGN UP -->
            <div class="col align-items-center flex-col sign-up">
                <div class="form-wrapper align-items-center">
                    <div class="form sign-up">
                        <h2>Create Account</h2>
                        <div class="input-group">
                            <i class='bx bx-mail-send'></i>
                            <input type="email" placeholder="Email" required>
                        </div>
                        <div class="input-group">
                            <i class='bx bxs-lock-alt'></i>
                            <input type="password" id="password" placeholder="Password" required>
                            <i class='bx bx-show' id="togglePassword" style="cursor: pointer; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);"></i>
                        </div>
                        <div class="input-group">
                            <i class='bx bxs-lock-alt'></i>
                            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                            <i class='bx bx-show' id="toggleConfirmPassword" style="cursor: pointer; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);"></i>
                        </div>
                        <button aria-label="Sign up">
                            Sign up
                        </button>
                        <p>
                            <span>
                                Already have an account?
                            </span>
                            <b onclick="toggle()" class="pointer">
                                Sign in here
                            </b>
                        </p>
                    </div>
                </div>
            </div>
            <!-- END SIGN UP -->
            <!-- SIGN IN -->
            <div class="col align-items-center flex-col sign-in">
                <div class="form-wrapper align-items-center">
                    <div class="form sign-in">
                        <h2>Welcome Back</h2>
                        <div class="input-group">
                            <i class='bx bx-mail-send'></i>
                            <input type="email" placeholder="Email" required>
                        </div>
                        <div class="input-group">
                            <i class='bx bxs-lock-alt'></i>
                            <input type="password" id="passwordSignIn" placeholder="Password" required>
                            <i class='bx bx-show' id="togglePasswordSignIn" style="cursor: pointer; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);"></i>
                        </div>
                        <button aria-label="Sign in">
                            Sign in
                        </button>
                        <div class="forgot-password">
                            <b onclick="forgotPassword()">
                                Forgot password?
                            </b>
                        </div>
                        <p>
                            <span>
                                Don't have an account?
                            </span>
                            <b onclick="toggle()" class="pointer">
                                Sign up here
                            </b>
                        </p>
                    </div>
                </div>
            </div>
            <!-- END SIGN IN -->
        </div>
        <!-- END FORM SECTION -->
    </div>

    <!-- Modal for Forgot Password -->
    <div id="forgotPasswordModal" class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <div class="modal-content">
            <h3 id="modalTitle">Reset Password</h3>
            <p>Please enter your email address:</p>
            <input type="email" id="resetEmail" placeholder="Email" required>
            <button onclick="sendResetLink()">Send Reset Link</button>
            <button onclick="closeModal()" style="background-color: red;">Cancel</button>
        </div>
    </div>

    <script src="firebase.js"></script>

    <script>
        const container = document.getElementById('container');

        const toggle = () => {
            container.classList.toggle('sign-in');
            container.classList.toggle('sign-up');
        }

        const forgotPassword = () => {
            document.getElementById('forgotPasswordModal').style.display = 'flex';
        }

        const closeModal = () => {
            document.getElementById('forgotPasswordModal').style.display = 'none';
        }

        const sendResetLink = () => {
            const email = document.getElementById('resetEmail').value;
            if (email) {
                alert(`Password recovery instructions have been sent to ${email}.`);
                closeModal();
            } else {
                alert("Please enter a valid email address.");
            }
        }

        // Password visibility toggle for sign-up
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const passwordType = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', passwordType);
            this.classList.toggle('bx-show');
            this.classList.toggle('bx-hide');
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', function () {
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const confirmPasswordType = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', confirmPasswordType);
            this.classList.toggle('bx-show');
            this.classList.toggle('bx-hide');
        });

        // Password visibility toggle for sign-in
        document.getElementById('togglePasswordSignIn').addEventListener('click', function () {
            const passwordInput = document.getElementById('passwordSignIn');
            const passwordType = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', passwordType);
            this.classList.toggle('bx-show');
            this.classList.toggle('bx-hide');
        });

        setTimeout(() => {
            container.classList.add('sign-in');
        }, 200);
    </script>
</body>
</html>
